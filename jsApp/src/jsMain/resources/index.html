<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KSafeDemo</title>
    <style>
        :root {
            color-scheme: light dark;
            --startup-background: #fffbfe;
            --startup-foreground: #1c1b1f;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --startup-background: #1c1b1f;
                --startup-foreground: #e6e1e5;
            }
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: var(--startup-background);
        }

        #app-startup-placeholder {
            position: fixed;
            inset: 0;
            z-index: 2147483647;
            display: grid;
            place-items: center;
            background: var(--startup-background);
            color: var(--startup-foreground);
        }

        #app-startup-placeholder svg {
            width: 112px;
            height: 112px;
        }
    </style>
    <script defer src="jsApp.js"></script>
</head>
<body>
    <div id="app-startup-placeholder" role="status" aria-label="KSafe Demo" aria-busy="true">
        <svg viewBox="0 0 64 64" aria-hidden="true">
            <defs>
                <radialGradient id="left" cx="0" cy="0" r="1"
                    gradientTransform="translate(23.131 18.441) rotate(90) scale(42.132)"
                    gradientUnits="userSpaceOnUse">
                    <stop stop-color="#5383EC"/>
                    <stop offset="0.867" stop-color="#7F52FF"/>
                </radialGradient>
                <linearGradient id="top" x1="44.172" y1="4.377" x2="17.973" y2="34.035"
                    gradientUnits="userSpaceOnUse">
                    <stop stop-color="#33C3FF"/>
                    <stop offset="0.878" stop-color="#5383EC"/>
                </linearGradient>
            </defs>
            <path d="M56.25 18V46L32 60 7.75 46V18L32 4Z" fill="#6075F2"/>
            <path d="M41.5 26.5V37.5L32 43V60L56.25 46V18L41.5 26.5Z" fill="#6B57FF"/>
            <path d="M32 43L22.5 37.5V26.5L7.75 18V46L32 60V43Z" fill="url(#left)"/>
            <path d="M22.5 26.5L32 21L41.5 26.5L56.25 18L32 4L7.75 18L22.5 26.5Z"
                fill="url(#top)"/>
            <path d="M32 21L41.526 26.5V37.5L32 43L22.474 37.5V26.5L32 21Z"
                fill="#000000"/>
        </svg>
    </div>
</body>
</html>
